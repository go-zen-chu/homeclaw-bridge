name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit & E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test ./internal/... -v -count=1

      - name: Run e2e tests
        run: go test ./test/e2e/... -v -count=1
